name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Verify generated grammar is committed
        run: npm run build:grammar:check

      - name: Type check
        run: npm run typecheck

      - name: Core tests
        run: npm run test:core

      - name: Grammar tests
        run: npm run test:unit && npm run test:snap

      - name: Bundle extension
        run: npm run build:extension

      - name: Package extension
        run: npx vsce package --no-dependencies --out pine-script-syntax-highlighter.vsix

      - name: Verify bundle in package
        run: unzip -l pine-script-syntax-highlighter.vsix | grep -q 'extension/dist/extension.cjs'

      - uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: pine-script-syntax-highlighter.vsix
